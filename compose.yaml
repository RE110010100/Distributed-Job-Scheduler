name: distributed-job-scheduler

x-service-environment: &service-environment
  DJS_ENVIRONMENT: ${DJS_ENVIRONMENT:-development}
  DJS_SHUTDOWN_TIMEOUT: ${DJS_SHUTDOWN_TIMEOUT:-10s}

x-service-defaults: &service-defaults
  restart: unless-stopped
  environment:
    <<: *service-environment
  stop_grace_period: 15s

services:
  api:
    <<: *service-defaults
    build:
      context: .
      args:
        SERVICE: api
    environment:
      <<: *service-environment
      DJS_API_ADDRESS: ":8080"
      DJS_DATABASE_URL: postgres://postgres:postgres@postgres:5432/djs?sslmode=disable
      DJS_INTERNAL_API_CREDENTIALS: ${DJS_INTERNAL_API_CREDENTIALS:-example-service:change-me}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    <<: *service-defaults
    build:
      context: .
      args:
        SERVICE: scheduler
    environment:
      <<: *service-environment
      DJS_DATABASE_URL: postgres://postgres:postgres@postgres:5432/djs?sslmode=disable
      DJS_SCHEDULER_GRPC_ADDRESS: ":9090"
      DJS_WORKER_HEARTBEAT_TIMEOUT: "15s"
      DJS_WORKER_LIVENESS_CHECK_INTERVAL: "5s"
      DJS_GRPC_RPC_TIMEOUT: "5s"
      DJS_WORKER_AUTH_TOKEN: ${DJS_WORKER_AUTH_TOKEN:-development-worker-token}
    ports:
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    <<: *service-defaults
    build:
      context: .
      args:
        SERVICE: worker
    environment:
      <<: *service-environment
      DJS_WORKER_ID: worker-1
      DJS_SCHEDULER_ADDRESS: scheduler:9090
      DJS_WORKER_CPU_MILLIS: "4000"
      DJS_WORKER_MEMORY_BYTES: "8589934592"
      DJS_WORKER_AUTH_TOKEN: ${DJS_WORKER_AUTH_TOKEN:-development-worker-token}
    depends_on:
      - scheduler
  
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: djs
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d djs"]
      interval: 2s
      timeout: 5s
      retries: 15
